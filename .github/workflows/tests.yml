name: TripPlanner checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python release_checks.py
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tripplanner_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: tripplanner_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripplanner_test -d tripplanner_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: "1"
      TRIPPLANNER_TEST_POSTGRES_DSN: postgresql://tripplanner_test:isolated-ci-password@127.0.0.1:5432/tripplanner_test_admin
      TRIPPLANNER_TEST_PG_BIN: ${{ github.workspace }}/.tmp/ci-pg-bin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/ci_postgres_tools.py .tmp/ci-pg-bin
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      - run: python -m pytest tests/test_hosted_postgres.py -q
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
